[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redirect-contract"
version = "0.1.0"
description = "Assert that old URLs still redirect where you intended, as a YAML contract you can run in CI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "jin", email = "lkdmc7168@gmail.com" }]
keywords = ["redirect", "cli", "http", "testing", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "rich>=13.7",
  "PyYAML>=6.0",
]

[project.scripts]
redirect-contract = "redirect_contract.cli:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.9",
  "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/redirect_contract"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's Option()/Argument() defaults are the documented API, not the
# mutable-default-argument footgun B008 is meant to catch.
"src/redirect_contract/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
packages = ["redirect_contract"]

[[tool.mypy.overrides]]
module = "redirect_contract.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
